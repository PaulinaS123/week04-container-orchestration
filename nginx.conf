
events {}

http {
    resolver 127.0.0.11 valid=5s;

    upstream web_backend {
        zone web_backend 64k;
        server web:3000 resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
        }
    }
}
