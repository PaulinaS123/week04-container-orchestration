
services:
  web:
    build: .
    image: week04-web-app:v1
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

    expose:
      - "3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    cpus: 0.5
    mem_limit: 256m

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      web:
        condition: service_healthy

    restart: unless-stopped

    cpus: 0.25
    mem_limit: 128m
